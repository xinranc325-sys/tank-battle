<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Tank Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>坦克大战</h1>
            <div class="score-board">
                <div class="score">分数: <span id="score">0</span></div>
                <div class="lives">生命: <span id="lives">3</span></div>
                <div class="level">关卡: <span id="level">1</span></div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <div class="info">
                <p><strong>操作说明：</strong></p>
                <p>方向键 - 移动坦克</p>
                <p>空格键 - 发射子弹</p>
                <p>P 键 - 暂停游戏</p>
            </div>
            <button id="startBtn" class="btn">开始游戏</button>
            <button id="pauseBtn" class="btn" disabled>暂停</button>
        </div>

        <div id="gameOver" class="modal hidden">
            <div class="modal-content">
                <h2>游戏结束</h2>
                <p>最终分数: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="btn">重新开始</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
